        <script>
            var allcompanies = [];
            window.onload = function() {
                getallcompany()
                    .then(companies => {
                        allcompanies = companies;
                    });
            };
            // 搜尋公司 1
            const form1 = document.getElementById('searchForm1')
            const input1 = document.getElementById('searchInput1')
            
            searchForm1.addEventListener('submit', () => {    
                // 阻止表單預設提交   
                event.preventDefault();
                //防呆
                if (document.getElementById('searchInput1').value == document.getElementById('searchInput2').value ){
                    if(document.getElementById('searchInput1').value =="" && document.getElementById('searchInput2').value=="")
                        alert("請選擇公司!");
                    else{
                        alert("請選擇兩家不同的公司!");
                    }
                }else{
                    if (existcheck(document.getElementById('searchInput1').value,document.getElementById('searchInput2').value,allcompanies)){
                        // 獲取輸入資料
                        var stockSymbol = input1.value;
                        getContral(stockSymbol, "a");
                        getShareType(stockSymbol, "a");
                        getSalary(stockSymbol, "a");
                        getDataKL(stockSymbol, 1);
                        getDataInfo(stockSymbol, 1);
                        getDataNews(stockSymbol, 1);
                        getDataIT(document.getElementById('searchInput1').value,document.getElementById('searchInput2').value);

                        //持股質押
                        //直接把兩個表單的值都丟進去，再決定要畫一家還兩家
                        drawgraph3(document.getElementById('searchInput1').value,document.getElementById('searchInput2').value);
                        drawgraph5(document.getElementById('searchInput1').value,document.getElementById('searchInput2').value);
                    }
                }
            });

            // 搜尋公司 2
            const form2 = document.getElementById('searchForm2')
            const input2 = document.getElementById('searchInput2')
            searchForm2.addEventListener('submit', () => {           
                // 阻止表單預設提交   
                event.preventDefault();
                if (document.getElementById('searchInput1').value == document.getElementById('searchInput2').value ){
                    if(document.getElementById('searchInput1').value =="" && document.getElementById('searchInput2').value=="")
                        alert("請選擇公司!");
                    else{
                        alert("請選擇兩家不同的公司!");
                    }
                }else{
                    if (existcheck(document.getElementById('searchInput1').value,document.getElementById('searchInput2').value,allcompanies)){
                    // 獲取輸入資料
                    var stockSymbol = input2.value;

                    // Functions
                    getContral(stockSymbol, "b");
                    getShareType(stockSymbol, "b");
                    getSalary(stockSymbol, "b");
                    getDataKL(stockSymbol, 2);
                    getDataInfo(stockSymbol, 2);
                    getDataNews(stockSymbol, 2);
                    getDataIT(document.getElementById('searchInput1').value,document.getElementById('searchInput2').value);

                    //持股質押
                    //直接把兩個表單的值都丟進去，再決定要畫一家還兩家
                    drawgraph3(document.getElementById('searchInput1').value,document.getElementById('searchInput2').value);
                    drawgraph5(document.getElementById('searchInput1').value,document.getElementById('searchInput2').value);
                    }
                }
            });

            // -------------------------------
            function getContral(stockSymbol, a_or_b) {    
                fetch(`/getContral?symbol=${stockSymbol}`)
                    .then(response => response.json())
                    .then(data => {
                        // 數據
                        var dataTrans = JSON.parse(data);
                        if(a_or_b == "a"){
                            var pre = document.getElementById("contral_a_svg");
                            if(pre){
                                pre.parentNode.removeChild(pre);
                            }
                            // 配置圖表的寬度、高度等參數
                            var temp_width = document.getElementById("salary_a_test").offsetWidth;
                            /*const width = 400;
                            const height = 400;*/
                            var width = document.getElementById("contral_a_test").getBoundingClientRect().width;
                            var height = document.getElementById("contral_a_test").getBoundingClientRect().height;
                            const margin = { top: 65, right: 40, bottom: 40, left: 40 };

                            // 建立 SVG 容器
                            const svg = d3.select("#contral_a_test")
                                .append("svg")
                                .attr("width", width)
                                .attr("height", height)
                                .attr('id', "contral_a_svg");

                            // 使用 d3.stack() 建立堆疊資料
                            const stack = d3.stack()
                                .keys(["直接持股%", "間接持股%"])
                                .order(d3.stackOrderNone)
                                .offset(d3.stackOffsetNone);

                            const stackedData = stack(dataTrans);

                            // 設定 x 軸和 y 軸的比例尺
                            const xScale = d3.scaleBand()
                                .domain(dataTrans.map(d => `${d.年}-${d.月}`))
                                .range([margin.left, width - margin.right])
                                .padding(0.1);

                            const yScale = d3.scaleLinear()
                                .domain([0, 100])
                                .range([height - margin.bottom, margin.top]);

                            // 建立顏色比例尺
                            const color = d3.scaleOrdinal()
                                .domain(["直接持股%", "間接持股%"])
                                .range(["RGB(102, 153, 181)", "RGB(234, 176, 125)"]);

                            // 建立堆疊長條圖
                            svg.selectAll("g")
                                .data(stackedData)
                                .enter().append("g")
                                .attr("fill", d => color(d.key))
                                .selectAll("rect")
                                .data(d => d)
                                .enter().append("rect")
                                .attr("x", d => xScale(`${d.data.年}-${d.data.月}`))
                                .attr("y", d => yScale(d[1]))
                                .attr("height", d => yScale(d[0]) - yScale(d[1]))
                                .attr("width", xScale.bandwidth());

                            // 加入 x 軸
                            svg.append("g")
                                .attr("transform", `translate(0,${height - margin.bottom})`)
                                .call(d3.axisBottom(xScale))
                                .selectAll("text") // 選取所有文字標籤
                                .attr("transform", "rotate(-25)") // 旋轉角度，負值表示逆時針旋轉
                                .style("text-anchor", "end"); // 文字對齊方式，這裡選擇末端對齊;

                            // 加入 y 軸
                            svg.append("g")
                                .attr("transform", `translate(${margin.left},0)`)
                                .call(d3.axisLeft(yScale));
                            
                            // 建立圖例容器
                            const legend = svg.append("g")
                            .attr("class", "legend")
                            .attr("transform", `translate(${width - margin.right}, ${margin.top})`);

                            var temp_location = ['translate(0, 0)', 'translate(120, 0)']
                            // 設定圖例項目
                            const legendItems = legend.selectAll(".legend-item")
                            .data(["直接持股%", "間接持股%"])
                            .enter().append("g")
                            .attr("class", "legend-item")
                            .attr("transform", (d, i) => temp_location[i]);
                            

                            // 加入圖例矩形
                            legendItems.append("rect")
                            .attr("width", 18)
                            .attr("height", 18)
                            .attr("fill", d => color(d));

                            // 加入圖例文字
                            legendItems.append("text")
                            .attr("x", 24)
                            .attr("y", 9)
                            .attr("dy", "0.35em")
                            .text(d => d);

                            // 透過計算總寬度，設定圖例容器的整體水平偏移
                            const totalLegendWidth = legend.node().getBBox().width;
                            legend.attr("transform", `translate(20, 5)`);

                            svg.append("text")
                                .attr("y", 38)
                                .attr("x", 26)
                                .attr("dy", "1em")
                                .style("text-anchor", "middle")
                                .text("(%)");
                        }
                        else{
                            var pre = document.getElementById("contral_b_svg");
                            if(pre){
                                pre.parentNode.removeChild(pre);
                            }
                            // 配置圖表的寬度、高度等參數
                            //const width = 400;
                            //const height = 400;
                            var width = document.getElementById("contral_b_test").getBoundingClientRect().width;
                            var height = document.getElementById("contral_b_test").getBoundingClientRect().height;
                            const margin = { top: 65, right: 40, bottom: 40, left: 40 };

                            // 建立 SVG 容器
                            const svg = d3.select("#contral_b_test")
                                .append("svg")
                                .attr("width", width)
                                .attr("height", height)
                                .attr('id', "contral_b_svg");

                            // 使用 d3.stack() 建立堆疊資料
                            const stack = d3.stack()
                                .keys(["直接持股%", "間接持股%"])
                                .order(d3.stackOrderNone)
                                .offset(d3.stackOffsetNone);

                            const stackedData = stack(dataTrans);

                            // 設定 x 軸和 y 軸的比例尺
                            const xScale = d3.scaleBand()
                                .domain(dataTrans.map(d => `${d.年}-${d.月}`))
                                .range([margin.left, width - margin.right])
                                .padding(0.1);

                            const yScale = d3.scaleLinear()
                                .domain([0, 100])
                                .range([height - margin.bottom, margin.top]);

                            // 建立顏色比例尺
                            const color = d3.scaleOrdinal()
                                .domain(["直接持股%", "間接持股%"])
                                .range(["RGB(102, 153, 181)", "RGB(234, 176, 125)"]);

                            // 建立堆疊長條圖
                            svg.selectAll("g")
                                .data(stackedData)
                                .enter().append("g")
                                .attr("fill", d => color(d.key))
                                .selectAll("rect")
                                .data(d => d)
                                .enter().append("rect")
                                .attr("x", d => xScale(`${d.data.年}-${d.data.月}`))
                                .attr("y", d => yScale(d[1]))
                                .attr("height", d => yScale(d[0]) - yScale(d[1]))
                                .attr("width", xScale.bandwidth());

                            // 加入 x 軸
                            svg.append("g")
                                .attr("transform", `translate(0,${height - margin.bottom})`)
                                .call(d3.axisBottom(xScale))
                                .selectAll("text") // 選取所有文字標籤
                                .attr("transform", "rotate(-25)") // 旋轉角度，負值表示逆時針旋轉
                                .style("text-anchor", "end"); // 文字對齊方式，這裡選擇末端對齊;

                            // 加入 y 軸
                            svg.append("g")
                                .attr("transform", `translate(${margin.left},0)`)
                                .call(d3.axisLeft(yScale));
                            
                            svg.append("text")
                                .attr("y", 38)
                                .attr("x", 26)
                                .attr("dy", "1em")
                                .style("text-anchor", "middle")
                                .text("(%)");
                        }
                    })
                    .catch(error => console.error("Error:", error));
            }

                            const legend = svg.append("g")

                                    "translate(139,20)", "translate(-4,39)", "translate(139,39)", "translate(244,0)"]

                                .enter().append("g")

                                .attr("transform", function(d,i) { return temp_location[i]; });
                            
                            
                            //.attr("transform", (d, i) => `translate(0, ${i * 20})`);

                            // 加入圖例矩形

                                .offset(d3.stackOffsetNone);

                                .domain(dataTrans.map(d => `${d.年}-${d.月}`))

                                .call(d3.axisBottom(xScale))

                            svg.append("g")
                                .attr("transform", `translate(${margin.left},0)`)

                                .attr("y", 38)
